# Alembic — configuração principal do Precificador.
#
# Execução típica:
#     cd precificador
#     alembic upgrade head
#
# O DATABASE_URL é lido do .env via env.py (não use sqlalchemy.url aqui).
[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url é definido dinamicamente em db/migrations/env.py
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
